name: CI

# Qualidade em todo push para main e todo PR: fmt, clippy, build --locked e testes.
# Autossuficiente: não depende de workflows de outra organização.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependências de build (Linux)
        if: runner.os == 'Linux'
        run: |
          ok=0
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && ok=1 && break
            echo "apt: tentativa $try falhou — repetindo em 20s (blip de mirror do runner)"
            sleep 20
          done
          [ "$ok" = 1 ]
          ok=0
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
              libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev \
              mesa-vulkan-drivers && ok=1 && break
            echo "apt: tentativa $try falhou — repetindo em 20s (blip de mirror do runner)"
            sleep 20
          done
          [ "$ok" = 1 ]
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build --locked
        run: cargo build --locked
      - name: Testes
        run: cargo test --locked

  git-sources:
    name: Sem dependências git remotas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cargo.lock não pode ter fontes git+
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")})
          if bad:
              print("Dependências git encontradas (proibido):", *bad, sep="\n")
              sys.exit(1)
          PY

  deny:
    name: cargo-deny (licenças, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
