name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX Toolset (v5 + extensões UI/Util, como packaging/windows/package.ps1 espera)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build e pacote (MSI per-machine + portable zip)
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev zsync
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build e pacote
        run: packaging/linux/package.sh --formats "appimage deb rpm tar"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error

  arch:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist/release
      - name: Pacote Arch (makepkg a partir do tarball da release)
        run: |
          set -euo pipefail
          # makepkg recusa root: usuário sem privilégio constrói; fakeroot
          # normaliza a posse dos arquivos do pacote.
          pacman -Sy --noconfirm fakeroot >/dev/null
          useradd -m builder
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          work=$(mktemp -d)
          cp packaging/arch/PKGBUILD "$work/"
          cp "dist/release/local-image-$version-linux-x86_64.tar.gz" "$work/local-image-$version-linux-x86_64.tar.gz"
          # Fonte local (a URL da release ainda não existe neste ponto do
          # pipeline) + checksum REAL do artefato em vez de SKIP.
          sha=$(sha256sum "$work/local-image-$version-linux-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s|^source=.*|source=(\"local-image-\$pkgver-linux-x86_64.tar.gz\")|; s|^sha256sums=.*|sha256sums=('$sha')|" "$work/PKGBUILD"
          chown -R builder "$work"
          cd "$work"
          su builder -c 'makepkg --noconfirm --noprogressbar'
          mv local-image-*.pkg.tar.zst "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Local Image ${GITHUB_REF_NAME}" \
            --notes "Visualizador de imagens 100% local e offline - export sempre re-encodado (EXIF nunca sobrevive)." \
            dist/windows/* dist/linux/* dist/arch/* dist/SHA256SUMS.txt \
          || gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/windows/* dist/linux/* dist/arch/* dist/SHA256SUMS.txt
