[workspace]
resolver = "3"
members = ["xtask", "lab-ui"]
default-members = [".", "lab-ui"]
exclude = ["libs"]

# Forks vendored (egui 6d518fc, winit a517b38) — receita no AGENTS.md do local-office.
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
# // local-image: fork do rustls-rustcrypto (experimento TLS puro do updater).
# O upstream 0.0.2-alpha puxa rustls-webpki 0.102 só pelas constantes `alg_id`;
# o fork usa `rustls-pki-types` e some com os advisories (README no próprio fork).
rustls-rustcrypto = { path = "libs/rustls-rustcrypto" }

[package]
name = "local-image"
version = "0.5.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Anon5T4R/Local-Image"
description = "Visualizador de imagens 100% local e offline — export sempre re-encodado (EXIF nunca sobrevive)"

[build-dependencies]
# Embute o ícone no .exe (Windows) — sem isso o Explorer mostra ícone genérico.
winresource = "0.1"

[dependencies]
eframe = "0.37"
egui = "0.37"
# 0.25.9+ = API de hooks que o jxl-image-rs-integration exige (`image::hooks`).
image = "0.25.9"
# JPEG XL (decode): jxl-rs — o decoder usado por Chrome/Firefox, 100% Rust,
# BSD-3. Registra o hook uma vez e `image::open` passa a entender `.jxl`.
# (Encode JXL avaliado e vetado: jxl-encoder é AGPL; deny.toml só permite
# deps permissivas.)
jxl-image-rs-integration = "0.8"
lab-ui = { path = "lab-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EXIF só-leitura do painel de metadados (o export NUNCA copia EXIF)
kamadak-exif = "0.6"
# Atualização: craft_update (libs/craft-libs) — check no GitHub, prompt egui e
# self-update (Windows: MSI/portable; Linux: AppImage/tar.gz). O `egui` liga o
# prompt e o Updater de UI.
craft-update = { path = "libs/craft-libs/crates/update", features = ["egui"] }

[target.'cfg(windows)'.dependencies]
# Seletor NATIVO de pasta do estado vazio (padrão da suíte: keys/player têm o
# rfd exatamente aqui). `default-features = false` = sem XDG portal; e fora do
# Windows o crate nem entra: em Linux o build aborta sem um backend
# ("choose at least one backend: gtk3 or xdg-portal") e ligar o portal
# engordaria o AppImage — lá o caminho da pasta continua digitado.
rfd = { version = "0.17", default-features = false }
# Abrir a página da release ("Download" do prompt do updater) — mesmo caminho
# do local-keys (ShellExecuteW, sem dep extra de shell). 0.62 = a mesma
# versão que wgpu/gpu-allocator já puxam: única instância de `windows` no
# grafo (duas quebram o dx12 do wgpu-hal).
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
